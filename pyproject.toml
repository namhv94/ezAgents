[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ezagents"
version = "0.1.0"
description = "Production-grade Model Context Protocol (MCP) agent orchestration engine with deterministic verifiers and sandbox safety."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "EzLabs Team", email = "contact@ezlabs.tech" }
]
keywords = ["mcp", "agents", "model-context-protocol", "orchestration", "safety", "ezlabs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://ezlabs.tech"
Repository = "https://github.com/namhv94/ezAgents"
"Bug Tracker" = "https://github.com/namhv94/ezAgents/issues"

[project.scripts]
ezagents = "ezagents.cli:main"
